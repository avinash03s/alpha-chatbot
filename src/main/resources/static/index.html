<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Alpha</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
</head>
<body>

<div class="background"></div>

<div class="container">

    <header class="header">

        <div class="brand" id="brandBtn">
            <img src="assets/logo.svg" alt="Alpha">
            <span>Alpha</span>
            <span class="brand-badge">Beta</span>
        </div>

        <div class="brand-popup" id="brandPopup">
            <div class="popup-logo">
                <img src="assets/logo.svg" alt="Alpha">
            </div>
            <h3 class="popup-title">Alpha</h3>
            <p class="popup-dev">Developed by <span>Avinash</span></p>
            <div class="popup-divider"></div>
            <div class="popup-row"><i class="ti ti-sparkles"></i> AI-powered assistant</div>
            <div class="popup-row"><i class="ti ti-shield-check"></i> Private &amp; secure</div>
            <div class="popup-row"><i class="ti ti-versions"></i> Version 1.0 Beta</div>
        </div>

        <div class="header-right">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">Online</span>
            </div>
            <button id="refreshBtn" class="icon-btn" aria-label="Clear chat" title="Clear chat">
                <i class="ti ti-refresh"></i>
            </button>
            <button id="themeBtn" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
                <i class="ti ti-sun" id="themeIcon"></i>
            </button>
        </div>

    </header>

    <main class="chat-wrapper">

        <div id="chatBody" class="chat-body">

            <div class="hero" id="heroSection">
                <img src="assets/logo.svg" alt="Alpha" class="hero-logo">
                <h1>Alpha</h1>
                <p>Your AI assistant for questions, ideas, research, learning, productivity, and everyday work.</p>
                <div class="hero-chips">
                    <button class="chip" id="chip1">Summarize</button>
                    <button class="chip" id="chip2">Brainstorm</button>
                    <button class="chip" id="chip3">Write email</button>
                    <button class="chip" id="chip4">Explain</button>
                </div>
            </div>

        </div>

        <div class="input-wrapper">
            <div class="input-box">
                <textarea
                        id="question"
                        rows="1"
                        placeholder="Message Alpha..."
                        aria-label="Message input">
                </textarea>
                <button id="sendBtn" aria-label="Send message">
                    <i class="ti ti-send"></i>
                </button>
            </div>
            <p class="footer-hint">Alpha can make mistakes. Verify important info.</p>
        </div>

    </main>

</div>

<script src="js/app.js"></script>
</body>
</html>
